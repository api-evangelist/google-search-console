provider: Google Search Console
providerId: google-search-console
scheme: dated Discovery-document revision (YYYYMMDD); no semantic version, no human changelog
published_changelog: false
finding: >-
  Google publishes no changelog for the Search Console API. The path this repo previously pointed
  at as a ChangeLog — https://developers.google.com/webmaster-tools/v1/release-notes — returns HTTP
  404 and has been removed from apis.yml. The only version signal Google emits for these APIs is
  the `revision` date stamped on each Discovery document, which changes several times a month
  without any statement of what changed. A consumer who needs to know when the contract moved must
  diff the Discovery document themselves; there is nothing to subscribe to. The Search Central
  "What's new" feed is a documentation changelog for Search features, not an API changelog, and
  the two do not track each other.
