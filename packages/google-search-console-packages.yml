  note: >-
    Google does not ship a hand-written SDK for Search Console. Every client below is generated
    from the same Google Discovery document this repo harvested
    (https://searchconsole.googleapis.com/$discovery/rest?version=v1 and
    https://indexing.googleapis.com/$discovery/rest?version=v3), published under the googleapis
    GitHub organization. Two categories exist: the umbrella client for the whole Google API
    surface (googleapis, google-api-python-client, google-api-php-client, google-api-go-client)
    and per-service generated packages (@googleapis/searchconsole,
    google-apis-searchconsole_v1, Google.Apis.SearchConsole.v1,
    com.google.apis:google-api-services-searchconsole). Currency varies sharply by ecosystem:
    the Node, Python, Ruby, .NET and Go clients are all released within the last 90 days, while
    the Java (Maven) artifacts are pinned to a 2025 and a 2023 discovery revision. The
    google-apis-webmasters_v3 gem and the google-api-client gem are superseded and have not
    shipped since 2021.
