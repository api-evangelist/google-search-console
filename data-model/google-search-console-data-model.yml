provider: Google Search Console
providerId: google-search-console
summary:
  entities: 22
  root_entities: 3
  relationships: 21
  note: >-
    There is no numeric or opaque identifier anywhere in this data model. Every entity is keyed by
    a URL string: a site by its verified property string (`https://example.com/` or
    `sc-domain:example.com`), a sitemap by its absolute feed path, an inspected page by its
    absolute URL. That makes URL normalization — trailing slash, scheme, www, percent-encoding —
    the single most common integration failure, because a mismatch produces a 403
    insufficientPermissions or a 404 rather than a lookup miss.
identifiers:
- entity: WmxSite
  field: siteUrl
  form: >-
    Either a URL-prefix property with a trailing slash (`https://www.example.com/`) or a domain
    property with the `sc-domain:` prefix (`sc-domain:example.com`). Must be percent-encoded when
    used as a path segment.
- entity: WmxSitemap
  field: path
  form: Absolute sitemap URL. Percent-encoded as the `feedpath` path segment.
- entity: UrlInspectionResult
  field: inspectionUrl
  form: Absolute URL of the page, which must fall inside the property named by siteUrl.
- entity: UrlNotification
  field: url
  form: Absolute URL of the page whose change is being announced.
