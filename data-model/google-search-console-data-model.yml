cross_api_joins:
- entities:
  - WmxSite
  - UrlNotification
  join_on: >-
    The Indexing API has no concept of a site. A url published through
    urlNotifications:publish is accepted only if it falls inside a Search Console property the
    calling service account owns, so the join between the two APIs is by URL prefix and is
    enforced server-side rather than expressed in the schema.
