aid: google-search-console
name: Google Search Console
description: >-
  Google Search Console gives site owners programmatic access to how their site appears in Google Search.
  Three separately versioned Google APIs make up the surface: the Search Console API for search analytics,
  sitemaps, site management and URL inspection; the URL Testing Tools API for the mobile-friendly test; and
  the Web Search Indexing API for telling Google that a page was published, updated or removed. All three are
  free of charge, authenticate with Google OAuth 2.0 against accounts.google.com, are authorized per verified
  property rather than per Cloud project, and are described by Google Discovery documents rather than a
  published OpenAPI.
